name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, tests (SQLite + PostgreSQL), migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      EDU_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL (schema built by the migrations)
        run: pytest
        env:
          EDU_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      - name: Migrations match the models
        run: alembic upgrade head && alembic check
        env:
          EDU_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

  web:
    name: Web · lint, typecheck, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e .
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images and compose file
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid
        run: cp .env.example .env && docker compose --env-file .env -f infra/docker-compose.yml config -q
      - name: Build the API image
        run: docker build -t eduverse-api:ci apps/api
      - name: Build the web image
        run: docker build -t eduverse-web:ci apps/web
