        concepts:
          - slug: domestic-electricity-ac-dc
            title: "Conductors, AC and DC, and domestic electric circuits"
            summary: >-
              Materials are conductors (silver is the best, then copper and aluminium, used for
              wires), insulators (rubber, glass, plastic, dry wood), semiconductors (silicon and
              germanium, used in diodes, transistors, LEDs and solar cells) or superconductors (zero
              resistance below a very low critical temperature). A cell or battery gives direct
              current (DC); Indian mains supply is alternating current (AC) at about 220-230 V and
              50 Hz. House wiring has live (red), neutral (black) and earth (green) wires, with
              appliances in parallel; a fuse or miniature circuit breaker (MCB) in the live wire
              breaks the circuit on overloading or a short circuit, and earthing the metal body of
              an appliance protects the user from shocks.
            difficulty: easy
            weight: 1.0
            prerequisites: [resistors-series-parallel, heating-effect-current]
            formulas:
              - key: ac-reversals
                name: Direction changes of AC
                expression: "AC of frequency f reverses direction 2f times a second (50 Hz → 100 times)"
            patterns:
