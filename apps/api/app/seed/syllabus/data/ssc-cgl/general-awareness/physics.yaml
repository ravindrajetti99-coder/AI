  - key: magnetism
    title: Magnetism and electromagnetism
    concepts:
      - slug: magnetism-and-electromagnetism
        title: "Magnetism, Earth's magnetism and electromagnetic induction"
        summary: >-
          A magnet has north and south poles (like poles repel, unlike poles attract) and its field
          lines run from north to south outside the magnet; iron, cobalt and nickel are
          ferromagnetic (strongly attracted). The Earth behaves like a huge magnet whose magnetic
          south pole lies near the geographic North Pole, so a compass needle points north.
          Oersted showed that a current produces a magnetic field (electromagnets use a soft-iron
          core); Faraday showed that a changing magnetic field induces a current (electromagnetic
          induction). An electric motor converts electrical energy into mechanical energy
          (Fleming's left-hand rule), a generator or dynamo converts mechanical energy into
          electrical energy (Fleming's right-hand rule), and a transformer, which works only on
          AC, steps voltage up or down. The SI unit of magnetic field is the tesla.
        difficulty: medium
        weight: 1.1
        prerequisites: [electric-current]
        formulas:
          - key: transformer
            name: Transformer ratio
            expression: "Vs / Vp = Ns / Np (ideal transformer)"
            example: {problem: "A transformer has 100 primary turns and 10 secondary turns. Find the output for 220 V input.", solution: "220 × 10/100 = 22 V (step-down)"}
          - key: fleming-rules
            name: "Fleming's rules"
            expression: "Left hand (motor): thumb = force/motion, first finger = field, second finger = current; right hand (generator): same fingers give the induced current"
        patterns:
          - key: device-principle
            title: Principle and energy conversion of a device
            example_stem: "An electric generator works on the principle of"
            frequency: high
            difficulty: easy
            target_seconds: 10
          - key: magnets-earth
            title: "Magnetic materials and the Earth's magnetism"
            example_stem: "Which of the following is a ferromagnetic substance? (a) copper (b) aluminium (c) nickel (d) wood"
            frequency: medium
            difficulty: easy
            target_seconds: 10
        shortcuts:
          - key: left-motor
            title: Left for motor, right for generator
            kind: memory
            rule: "Think 'geneRIGHTor': the right-hand rule is for generators, so the left-hand rule is for motors. A transformer works on AC only."
            example: {problem: "Which rule gives the direction of force on a current-carrying conductor in a motor?", shortcut: "Motor → left-hand rule", seconds_saved: 5}
            pattern: device-principle

  - key: modern-physics
    title: "Modern physics: atom, radioactivity and nuclear energy"
    concepts:
      - ref: atomic-structure-subatomic-particles
        weight: 0.8
      - slug: radioactivity-and-nuclear-energy
        title: "Radioactivity, nuclear fission and nuclear fusion"
        summary: >-
          Radioactivity, the spontaneous decay of unstable nuclei, was discovered by Henri
          Becquerel (1896) and studied by Marie and Pierre Curie (polonium and radium). Alpha
          particles are helium nuclei (least penetrating, stopped by paper), beta particles are
          electrons (stopped by a thin aluminium sheet) and gamma rays are electromagnetic waves
          (most penetrating, reduced by thick lead or concrete); half-life is the time for half the
          nuclei to decay, and carbon-14 (half-life about 5,730 years) dates fossils. Nuclear
          fission splits a heavy nucleus such as uranium-235 when it absorbs a neutron and releases
          more neutrons in a chain reaction: it powers nuclear reactors (moderator such as heavy
          water or graphite slows neutrons; control rods of cadmium or boron absorb them) and the
          atom bomb. Nuclear fusion joins light nuclei (hydrogen into helium), powers the Sun and
          stars and the hydrogen bomb; the energy comes from the mass defect, E = mc².
        difficulty: medium
        weight: 1.1
        prerequisites: [atomic-structure-subatomic-particles]
        formulas:
          - key: mass-energy
            name: Mass-energy equivalence
            expression: "E = mc²"
            example: {problem: "Energy equivalent of 1 g of mass.", solution: "0.001 × (3 × 10⁸)² = 9 × 10¹³ J"}
          - key: half-life
            name: Amount left after n half-lives
            expression: "N = N₀ × (1/2)ⁿ"
            example: {problem: "What fraction of a radioactive sample remains after 3 half-lives?", solution: "(1/2)³ = 1/8"}
        patterns:
          - key: radiation-types
            title: Alpha, beta and gamma radiation
            example_stem: "Which radiation has the highest penetrating power?"
            frequency: medium
            difficulty: easy
            target_seconds: 10
          - key: fission-fusion
            title: Fission, fusion and parts of a nuclear reactor
            example_stem: "The energy of the Sun is produced mainly by"
            frequency: high
            difficulty: easy
            target_seconds: 10
        shortcuts:
          - key: split-join
            title: Fission splits, fusion joins
            kind: memory
            rule: "Fission = split heavy (uranium, reactors, atom bomb); fusion = fuse light (hydrogen, Sun and stars, hydrogen bomb)."
            example: {problem: "A hydrogen bomb works on", shortcut: "Hydrogen is light → joined → fusion", seconds_saved: 5}
            pattern: fission-fusion

  - key: instruments
    title: Important instruments and inventions
    concepts:
      - slug: scientific-instruments-and-uses
        title: "Scientific instruments and what they measure"
        summary: >-
          SSC regularly asks which instrument measures what: altimeter (altitude), ammeter
          (current), voltmeter (potential difference), galvanometer (detects small currents),
          anemometer (wind speed), barometer (atmospheric pressure), hygrometer (relative
          humidity), hydrometer (relative density of liquids), lactometer (purity of milk),
          manometer (pressure of gases), pyrometer (very high temperatures), thermostat (keeps
          temperature constant), seismograph (earthquake waves), sphygmomanometer (blood pressure),
          stethoscope (heart and lung sounds), audiometer (hearing), odometer (distance travelled by
          a vehicle), speedometer (speed), tachometer (revolutions per minute), fathometer (depth
          of the sea), SONAR (underwater objects by sound), RADAR (distant objects by radio waves),
          periscope (seeing over obstacles, in submarines), sextant (angle of a star or the Sun,
          for navigation), chronometer (accurate time at sea) and crescograph (plant growth,
          invented by J.C. Bose).
        difficulty: easy
        weight: 1.5
        patterns:
          - key: instrument-quantity
            title: What an instrument measures
            example_stem: "A hygrometer is used to measure"
            frequency: high
            difficulty: easy
            target_seconds: 10
          - key: purpose-instrument
            title: Instrument for a stated purpose
            example_stem: "Which instrument is used to measure blood pressure?"
            frequency: high
            difficulty: easy
            target_seconds: 10
        shortcuts:
          - key: word-roots
            title: Decode the word root
            kind: memory
            rule: "hygro = moisture, anemo = wind, baro = pressure (weight), hydro = water, lacto = milk, pyro = fire, seismo = earthquake, sphygmo = pulse, tacho = speed, alti = height, odo = way, audio = hearing, cresco = grow."
            example: {problem: "An anemometer measures", shortcut: "anemo = wind → wind speed", seconds_saved: 5}
            pattern: instrument-quantity

      - slug: inventions-and-inventors
        title: "Inventions and their inventors"
        summary: >-
          Pairs SSC asks most: printing press with movable type (Johannes Gutenberg), telescope
          (Hans Lippershey; improved and turned to the sky by Galileo), mercury thermometer
          (Fahrenheit), barometer (Torricelli), improved steam engine (James Watt), electric
          battery (Alessandro Volta), dynamo and electromagnetic induction (Michael Faraday),
          telegraph and Morse code (Samuel Morse), dynamite (Alfred Nobel), telephone (Alexander
          Graham Bell, 1876), phonograph and a practical electric bulb (Thomas Edison), radio
          (Guglielmo Marconi), diesel engine (Rudolf Diesel), aeroplane (Wright brothers, 1903),
          television (John Logie Baird), jet engine (Frank Whittle), radar (Robert Watson-Watt),
