  - key: federalism
    title: Federal structure and centre-state relations
    concepts:
      - slug: centre-state-legislative-relations
        title: Centre-state legislative relations and the Seventh Schedule
        summary: >-
          Articles 245-255 divide law-making through the Seventh Schedule: Union List (defence,
          foreign affairs, banking, railways, currency; originally 97 subjects), State List (police,
          public order, public health, agriculture, local government; originally 66) and Concurrent
          List (education, forests, criminal law, marriage; originally 47). Residuary powers lie with
          Parliament (Article 248, from Canada); on a conflict in the Concurrent List the Union law
          prevails (Article 254). Parliament may legislate on State List subjects in the national
          interest after a Rajya Sabha resolution by two-thirds present and voting (Article 249),
          during a national emergency (250), when two or more states ask (252) or to implement
          treaties (253). The 42nd Amendment moved education, forests, weights and measures, wild
          animals and birds, and administration of justice to the Concurrent List.
        difficulty: medium
        weight: 1.2
        prerequisites: [constitution-schedules]
        patterns:
          - key: list-of-subject
            title: Which list a subject belongs to
            example_stem: "'Police' is a subject in which list of the Seventh Schedule?"
            frequency: high
            difficulty: easy
            target_seconds: 10
          - key: parliament-on-state-list
            title: When Parliament can legislate on the State List
            example_stem: "Under which article can Parliament make laws on a State List subject if the Rajya Sabha passes a resolution in the national interest?"
            frequency: medium
            difficulty: medium
            target_seconds: 15
        shortcuts:
          - key: concurrent-five
            title: The 42nd's five transfers
            kind: memory
            rule: "Five subjects moved from State to Concurrent in 1976: Education, Forests, Weights and measures, Wild animals and birds, Administration of justice (EF-WWA)."
            example: {problem: "Is 'forests' a State or Concurrent subject?", shortcut: "One of the five 1976 transfers → Concurrent", seconds_saved: 5}
            pattern: list-of-subject

      - slug: centre-state-administrative-financial-relations
        title: Administrative and financial relations, councils and commissions
        summary: >-
          States must exercise executive power so as to comply with Union laws and directions
          (Articles 256-257); inter-state water disputes go to tribunals under Article 262; the
          Inter-State Council (Article 263) was set up in 1990 on the Sarkaria Commission's
          advice and is chaired by the Prime Minister. Zonal councils (five, statutory under the
          States Reorganisation Act 1956) are chaired by the Union Home Minister. Taxes are shared
          on the Finance Commission's recommendation (Article 280) and grants given under Article 275;
          commissions on centre-state relations include Rajamannar (1969, Tamil Nadu), Sarkaria
          (1983) and Punchhi (2007).
        difficulty: medium
        weight: 0.9
        prerequisites: [centre-state-legislative-relations]
        patterns:
          - key: council-commission
            title: Councils and commissions on centre-state relations
            example_stem: "The Inter-State Council was set up in 1990 on the recommendation of which commission?"
            frequency: medium
            difficulty: medium
            target_seconds: 12
          - key: relation-article
            title: Article governing an administrative or financial relation
            example_stem: "Which article provides for the adjudication of disputes relating to inter-state rivers?"
            frequency: medium
            difficulty: medium
            target_seconds: 12
