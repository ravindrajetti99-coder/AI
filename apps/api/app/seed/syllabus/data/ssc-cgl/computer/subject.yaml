key: computer
title: Computer Knowledge
description: >-
  Computer fundamentals, hardware, memory, software and operating systems, office tools,
  networking, the internet, email and cyber security: Tier 2 Section III Module I
  (20 questions, qualifying).
tiers: [tier2]
strategies:
  - key: approach
    title: "Computer Knowledge: secure the qualifying marks"
    summary: >-
      The module is qualifying, but failing it disqualifies Tier 2. Twenty factual questions in
      15 minutes: cover the basics thoroughly rather than chasing rare facts.
    minutes: 15
    seconds_per_question: 40
    accuracy_target: 0.85
    tactics:
      - "Learn the standard abbreviations, keyboard shortcuts and memory units by heart."
      - "Know the main menu commands of Word, Excel and PowerPoint and common Excel functions."
      - "Revise networking and security terms with flashcards."
    avoid:
      - "Skipping this module in preparation because it does not count towards merit."
chapters:
  - fundamentals
  - hardware
  - memory-storage
  - software-os
  - ms-word
  - ms-excel
  - ms-powerpoint
  - networking-internet
  - email-web
  - cyber-security
  - data-representation
