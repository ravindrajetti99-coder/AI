[project]
name = "eduverse-api"
version = "0.1.0"
description = "EduVerse AI - AI Learning Operating System (API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "httpx>=0.27",
    "redis>=5.0",
    "anthropic>=1.13",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B904", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Models named Test/TestItem/TestAttempt are not test classes.
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestCollectionWarning"]
