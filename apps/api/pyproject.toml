[project]
name = "eduverse-api"
version = "0.1.0"
description = "EduVerse AI - AI Learning Operating System (API)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B904", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Models named Test/TestItem/TestAttempt are not test classes.
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestCollectionWarning"]
